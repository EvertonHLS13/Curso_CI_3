name: Entrega continua

on:
  workflow_call:

  workflow_dispatch:

jobs:
  ECS:
    name: Deploy ECS
    runs-on: ubuntu-latest

    steps:
      - name: Configurar credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.ID_CHAVE_ACESSO }}
          aws-secret-access-key: ${{ secrets.CHAVE_SECRETA }}
          aws-region: us-east-2

      - name: Baixar Task Definition atual
        run: |
          aws ecs describe-task-definition \
            --task-definition Tarefa_API-GO \
            --query taskDefinition \
            > task-definition.json

      - name: Backup da Task Definition
        run: |
          cp task-definition.json task-definition.json.old

      - name: Atualizar imagem do container
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: Go
          image: evertonhls/curso-ci-4-projeto-inicial:${{ github.run_number }}

      - name: Deploy ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: Servico_API_Go_CD
          cluster: Api-Go-CD
          wait-for-service-stability: true

      - name: Aguardar inicialização
        run: sleep 30

      - name: Testar aplicação
        id: teste
        continue-on-error: true
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            http://LB-API-Go-1760566551.us-east-2.elb.amazonaws.com:8000/bruno)

          echo "Status HTTP: $STATUS"

          if [ "$STATUS" = "200" ]; then
            echo "REQUEST=0" >> $GITHUB_ENV
          else
            echo "REQUEST=1" >> $GITHUB_ENV
            exit 1
          fi

      - name: Rollback ECS
        if: ${{ env.REQUEST == '1' }}
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: task-definition.json.old
          service: Servico_API_Go_CD
          cluster: Api-Go-CD
          wait-for-service-stability: true

      - name: Falhar workflow após rollback
        if: ${{ env.REQUEST == '1' }}
        run: |
          echo "Deploy inválido. Rollback executado."
          exit 1

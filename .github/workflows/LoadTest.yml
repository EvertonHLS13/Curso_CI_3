name: Load Test

on:
  workflow_call:

jobs:
  loadtest:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout aplicação
        uses: actions/checkout@v4

      - name: Configurando credenciais da AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.ID_CHAVE_ACESSO }}
          aws-secret-access-key: ${{ secrets.CHAVE_SECRETA }}
          aws-region: us-east-2

      - name: Clonar repositório Infra_CI
        run: |
          git clone https://github.com/EvertonHLS13/Infra_CI.git Infra_CI

      - name: HashiCorp - Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: Infra_CI/env/Homolog
        run: terraform init -input=false

      - name: Terraform Destroy inicial (limpeza)
        working-directory: Infra_CI/env/Homolog
        continue-on-error: true
        run: |
          terraform destroy -auto-approve -input=false || true

      - name: Terraform Apply
        working-directory: Infra_CI/env/Homolog
        run: |
          terraform apply \
            -auto-approve \
            -input=false

      - name: Obter DNS do ALB
        id: URL
        working-directory: Infra_CI/env/Homolog
        run: |
          ALB=$(terraform output -raw IP_alb)

          if [ -z "$ALB" ]; then
            echo "Erro: Não foi possível obter o DNS do ALB"
            exit 1
          fi

          echo "ALB criado: $ALB"

          echo "stdout=$ALB" >> "$GITHUB_OUTPUT"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Instalar Locust
        run: |
          python -m pip install --upgrade pip
          pip install locust

      - name: Criar locustfile.py
        run: |
          cat <<EOF > locustfile.py
          from locust import HttpUser, TaskSet, task, between

          class UserTasks(TaskSet):

              @task(1)
              def index(self):
                  self.client.get("/bruno")

          class WebsiteUser(HttpUser):
              tasks = [UserTasks]
              wait_time = between(1, 5)
          EOF

          cat locustfile.py

      - name: Aguardar ECS ficar pronto
        run: |
          URL="http://${{ steps.URL.outputs.stdout }}/bruno"

          echo "Aguardando aplicação responder em $URL"

          for i in {1..60}; do

            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL" || true)

            echo "Tentativa $i - HTTP $STATUS"

            if [ "$STATUS" = "200" ]; then
              echo "Aplicação pronta!"
              exit 0
            fi

            sleep 10
          done

          echo "Aplicação não respondeu HTTP 200."
          exit 1

      - name: Validar endpoint
        run: |
          echo "Testando endpoint..."
          curl -v http://${{ steps.URL.outputs.stdout }}/bruno

      - name: Roda teste de carga
        run: |
          locust \
            -f locustfile.py \
            --headless \
            -u 10 \
            -r 5 \
            --run-time 60s \
            --exit-code-on-error 1 \
            -H http://${{ steps.URL.outputs.stdout }}

      - name: Terraform Destroy final
        if: always()
        working-directory: Infra_CI/env/Homolog
        continue-on-error: true
        run: |
          terraform destroy \
            -auto-approve \
            -input=false

name: kubernetes

on:
  workflow_call:

jobs:
  EKS:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout aplicação
        uses: actions/checkout@v4

      - name: Configurando credenciais da AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.ID_CHAVE_ACESSO }}
          aws-secret-access-key: ${{ secrets.CHAVE_SECRETA }}
          aws-region: us-east-2


      - run: git clone https://github.com/EvertonHLS13/Infra_CI_Kubernetes.git

      - name: HashiCorp - Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: Infra_CI_Kubernetes/env/Homolog
        run: terraform init -input=false

      - run: terraform -chdir=Infra_CI_Kubernetes/env/Homolog apply -auto-approve

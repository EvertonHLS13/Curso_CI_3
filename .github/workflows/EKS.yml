name: kubernetes

on:
  workflow_call:

jobs:
  EKS:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout aplicação
        uses: actions/checkout@v4


      - name: Configurando credenciais da AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.ID_CHAVE_ACESSO }}
          aws-secret-access-key: ${{ secrets.CHAVE_SECRETA }}
          aws-region: us-east-2


      - name: Clonar repositório de infraestrutura
        run: |
          git clone https://github.com/EvertonHLS13/Infra_CI_Kubernetes.git


      - name: HashiCorp Setup Terraform
        uses: hashicorp/setup-terraform@v3


      - name: Terraform Init
        working-directory: Infra_CI_Kubernetes/env/Homolog
        run: |
          terraform init -input=false -reconfigure


      - name: Terraform Validate
        working-directory: Infra_CI_Kubernetes/env/Homolog
        run: |
          terraform validate


      - name: Terraform Plan
        working-directory: Infra_CI_Kubernetes/env/Homolog
        run: |
          terraform plan -input=false


      - name: Terraform Apply
        working-directory: Infra_CI_Kubernetes/env/Homolog
        run: |
          terraform apply -auto-approve

      - name: Kubectl tool installer
        uses: Azure/setup-kubectl@v3     

      - run: aws sts get-caller-identity  

      - run: aws eks update-kubeconfig --region us-east-2 --name homolog2

      - run: kubectl get svc

name: Go

on:
  push:
    branches:
      - '*'
  pull_request:
    branches:
      - '*'

jobs:
  test:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        go_version: ['1.17', '1.18']
        os: ['ubuntu-latest']

    env:
      HOST: localhost
      DBPORT: 5432
      USER: root
      PASSWORD: root
      DBNAME: root

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go_version }}

      - name: Verify Docker
        run: |
          docker --version
          docker compose version

      - name: Start PostgreSQL
        run: docker compose up -d

      - name: Wait for PostgreSQL
        run: |
          for i in {1..30}; do
            if docker compose exec -T postgres pg_isready -U root; then
              echo "PostgreSQL pronto!"
              exit 0
            fi
            echo "Aguardando PostgreSQL..."
            sleep 2
          done
          docker compose logs
          exit 1

      - name: Run Tests
        run: go test -v ./...

      - name: Show Docker Logs
        if: failure()
        run: docker compose logs

      - name: Stop Containers
        if: always()
        run: docker compose down -v

  build:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.18'

      - name: Build
        run: go build -v -o main main.go

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: programa
          path: main

  docker:
    needs: build
    uses: ./.github/workflows/Docker.yml
    secrets: inherit

  docker_EC2:
    needs: build
    uses: ./.github/workflows/EC2.yml
    secrets: inherit

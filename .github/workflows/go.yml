name: Go

on:
  push:
    branches:
      - '*'
  pull_request:
    branches:
      - '*'

jobs:
  test:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        go_version: ['1.17', '1.18']
        os: ['ubuntu-latest']

    env:
      HOST: localhost
      DBPORT: 5432
      USER: root
      PASSWORD: root
      DBNAME: root

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go_version }}

      - name: Verify Docker
        run: |
          docker --version
          docker compose version

      - name: Build database
        run: docker compose build

      - name: Start database
        run: docker compose up -d

      - name: Wait for database
        run: sleep 15

      - name: Run tests
        run: go test -v ./...

      - name: Stop containers
        if: always()
        run: docker compose down

  build:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.18'

      - name: Build application
        run: go build -v -o main main.go

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: programa
          path: main

  docker:
    needs: build
    uses: ./.github/workflows/Docker.yml
    secrets: inherit

  Deploy_ECS:
    needs: docker
    uses: ./.github/workflows/ECS.yml
    secrets: inherit

name: Go

on:
  push:
    branches:
      - '*'
  pull_request:
    branches:
      - '*'

jobs:

  test:
    name: Test Go
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        go_version: ['1.17', '1.18']

    env:
      HOST: localhost
      DBPORT: 5432
      DBUSER: postgres
      DBNAME: postgres
      DBPASSWORD: postgres

    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go_version }}


      - name: Instalar dependências
        run: |
          go mod download


      - name: Executar testes
        run: |
          go test ./...



  build:
    name: Build API
    runs-on: ubuntu-latest
    needs: test

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.18'


      - name: Build
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o api


      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: api
          path: api



  docker:
    name: Docker Build Push
    runs-on: ubuntu-latest
    needs: build

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: api


      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}


      - name: Build e Push imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            evertonhls/curso-ci-4-projeto-inicial:latest
